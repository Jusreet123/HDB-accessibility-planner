<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Haven.</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            haven<span>.</span>
        </a>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore HDB</a>
            <a href="#">Neighbourhoods</a>
            <a href="compare.html">Compare</a>
            <a href="insights.html">Market Insights</a>
        </nav>

        <div class="auth-nav">
            <a
                href="login.html"
                class="auth-login-btn"
                aria-current="page"
            >
                Login
            </a>
        </div>

    </header>

    <!-- =========================================
         AUTHENTICATION PAGE
    ========================================= -->

    <main class="auth-page">

        <section class="auth-card" aria-labelledby="authTitle">

            <!-- Heading -->
            <div class="auth-card-heading">

                <p class="eyebrow">
                    WELCOME TO HAVEN.
                </p>

                <h1 id="authTitle">
                    Welcome back.
                </h1>

                <p id="authDescription">
                    Sign in to save your favourite HDB homes.
                </p>

            </div>

            <!-- Authentication messages -->
            <div
                id="authMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <!-- =========================================
                 LOGIN FORM
            ========================================= -->

            <form id="loginForm" class="auth-form">

                <label for="loginEmail">
                    Email address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Sign In
                </button>

            </form>

            <!-- =========================================
                 REGISTRATION FORM
            ========================================= -->

            <form
                id="registerForm"
                class="auth-form"
                hidden
            >

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    maxlength="100"
                    required
                >

                <label for="registerEmail">
                    Email address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Create a password (min. 8 characters)"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Create Account
                </button>

            </form>

            <!-- =========================================
                 GOOGLE SIGN-IN
            ========================================= -->

            <div class="auth-divider">
                <span>or continue with</span>
            </div>

            <a
                href="/auth/google"
                class="google-auth-btn"
            >

                <!-- Google logo -->
                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                >
                    <path
                        fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                    />
                    <path
                        fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.8 7.18l7.73 6C44.38 38.03 46.98 31.88 46.98 24.55z"
                    />
                    <path
                        fill="#FBBC05"
                        d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"
                    />
                    <path
                        fill="#34A853"
                        d="M24 48c6.48 0 11.92-2.13 15.89-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.97 6.19C6.51 42.62 14.62 48 24 48z"
                    />
                </svg>

                <span>Continue with Google</span>

            </a>

            <!-- =========================================
                 LOGIN / REGISTER SWITCH
            ========================================= -->

            <p class="auth-switch">

                <span id="authSwitchText">
                    Don't have an account?
                </span>

                <button
                    type="button"
                    id="authSwitchBtn"
                >
                    Create an account
                </button>

            </p>

            <!-- Back to homepage -->
            <p class="auth-back">

                <a href="index.html">
                    Back to homepage
                </a>

            </p>

        </section>

    </main>

    <!-- =========================================
         AUTHENTICATION JAVASCRIPT
    ========================================= -->

    <script src="js/auth.js" defer></script>

</body>
</html>
